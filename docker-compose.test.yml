# Yalnız testler için: bellekte çalışan, atılabilir bir PostgreSQL.
#   docker compose -f docker-compose.test.yml up -d --wait && npm test
name: hali-saha-test
services:
  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30
